name: Generate ISO

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["bluebuild"]
    types:
      - completed

jobs:
  build-iso:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: fedora-kinoite-nitro-an515-43
            variant: Kinoite

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Get date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Build ISO
        uses: jasonn3/build-container-installer@v1.4.0
        id: build
        with:
          image_name: ${{ matrix.image_name }}
          image_repo: ghcr.io/${{ github.repository_owner }}
          image_tag: latest
          version: 43
          variant: ${{ matrix.variant }}
          iso_name: ${{ matrix.image_name }}.iso

      - name: Upload ISO as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.image_name }}
          path: |
            ./${{ matrix.image_name }}.iso
            ./${{ matrix.image_name }}.iso-CHECKSUM
          if-no-files-found: error

      - name: Split ISO if larger than 2GB
        run: |
          FILE="${{ matrix.image_name }}.iso"
          MAX_SIZE=2000000000
          FILE_SIZE=$(stat -c%s "$FILE")
          echo "ISO size: $FILE_SIZE bytes"
          if [ "$FILE_SIZE" -gt "$MAX_SIZE" ]; then
            echo "ISO exceeds 2GB, splitting..."
            split -b 1900M "$FILE" "${FILE}.part_"
            rm "$FILE"
            echo "SPLIT=true" >> $GITHUB_ENV
          else
            echo "ISO is under 2GB, no split needed."
            echo "SPLIT=false" >> $GITHUB_ENV
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: iso-${{ steps.date.outputs.date }}
          name: "ISO Build — ${{ steps.date.outputs.date }}"
          body: |
            Automated ISO build from `${{ github.sha }}`.

            **Image:** `ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}:latest`

            **To reassemble the ISO (if split into parts):**
            ```
            cat ${{ matrix.image_name }}.iso.part_* > ${{ matrix.image_name }}.iso
            ```
          files: |
            ${{ matrix.image_name }}.iso
            ${{ matrix.image_name }}.iso.part_*
            ${{ matrix.image_name }}.iso-CHECKSUM
