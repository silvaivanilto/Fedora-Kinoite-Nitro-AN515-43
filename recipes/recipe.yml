---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: fedora-kinoite-nitro-an515-43
description: Fedora Kinoite (Fedora 43 / Nvidia) optimized for Acer Nitro 5 (AN515-43).
base-image: ghcr.io/ublue-os/kinoite-nvidia
image-version: 43

modules:
  # 1. Repository Configuration
  - type: dnf
    repos:
      copr:
        - "@kdesig/kde-beta"

  # 2. System Base (RPM-OSTree) - Removals
  - type: rpm-ostree
    remove:
      # Browsers & Runtimes
      - firefox
      - firefox-langpacks

      # System Utilities & Bloat
      - firewall-config
      - kdebugsettings
      - plasma-drkonqi
      - htop
      - nvtop

      # Core & Configuration
      - fcitx5
      - fcitx5-configtool
      - fcitx5-data
      - fcitx5-libs
      - fcitx5-lua
      - fcitx5-m17n
      - kcm-fcitx5

      # UI Modules
      - fcitx5-gtk
      - fcitx5-gtk3
      - fcitx5-gtk4
      - fcitx5-qt
      - fcitx5-qt-libfcitx5qt6widgets
      - fcitx5-qt-libfcitx5qtdbus
      - fcitx5-qt-qt6gui
      - fcitx5-qt5
      - fcitx5-qt6

      # Fcitx5 Language Engines
      - fcitx5-chewing
      - fcitx5-chinese-addons
      - fcitx5-chinese-addons-data
      - fcitx5-hangul
      - fcitx5-libthai
      - fcitx5-mozc
      - fcitx5-sayura
      - fcitx5-unikey

      # Exclusive Fcitx5 Dependencies
      - libime
      - libime-data
      - xcb-imdkit

  # 2. System Base (RPM-OSTree) - Installations
  - type: rpm-ostree
    install:
      # Office Suite
      - libreoffice-calc
      - libreoffice-draw
      - libreoffice-filters
      - libreoffice-impress
      - libreoffice-kf6
      - libreoffice-langpack-pt-BR
      - libreoffice-writer

      # Power Management
      - switcheroo-control

      # System Integration & Tools
      - plasma-discover-rpm-ostree
      - plasma-firewall

  # 4. Files (Static Configuration)
  - type: files
    files:
      - source: rpms
        destination: /tmp/rpms
      - source: etc/rpm-ostreed.conf
        destination: /etc/rpm-ostreed.conf

  # 5. Homebrew
  - type: brew

  # 6. Fonts
  - type: fonts
    fonts:
      nerd-fonts:
        - NerdFontsSymbolsOnly
      google-fonts:
        - Fira Sans
        - Fira Mono

  # 7. Flatpaks (Flathub)
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: false
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
          name: flathub
          title: Flathub
        install:
          - com.google.Chrome
          - org.kde.okular
          - org.kde.elisa
          - org.kde.haruna
          - org.kde.skanpage
          - org.kde.kalk
          - org.kde.koko
          - org.kde.marknote
          - org.kde.merkuro
      - scope: user
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
          name: flathub
        remove-repo: true

  # 8. Service Configuration (Systemd)
  - type: systemd
    system:
      enabled:
        - nvidia-powerd.service
        - rpm-ostreed-automatic.timer
        - switcheroo-control.service

  # 9. Customization Scripts (Hardware & User)
  - type: script
    scripts:
      - install-oh-my-bash.sh # Terminal Setup
      - configure-nvidia.sh # GPU Power Management
      - setup-root-theme-sync.sh # Root Theme Sync
      - configure-grub.sh # Bootloader Configuration
      - install-epson-escpr.sh # Printer Drivers

  # 10. Image Signing (Cosign)
  - type: signing
