---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: fedora-kinoite-nitro-an515-43
description: Fedora Kinoite (Fedora 43 / Nvidia) optimized for Acer Nitro 5 (AN515-43).
base-image: ghcr.io/ublue-os/kinoite-nvidia
image-version: 43

modules:
  # 1. System Base (RPM-OSTree) - Installations
  - type: rpm-ostree
    install:
      # Office Suite
      - libreoffice-calc
      - libreoffice-draw
      - libreoffice-filters
      - libreoffice-impress
      - libreoffice-kf6
      - libreoffice-langpack-pt-BR
      - libreoffice-math
      - libreoffice-opensymbol-fonts
      - libreoffice-pdfimport
      - libreoffice-writer
      - autocorr-pt
      - liberation-fonts

      # Power Management
      - switcheroo-control

      # Bootloader
      - os-prober

      # System Integration & Tools
      - plasma-discover-rpm-ostree
      - plasma-firewall

  # 2. System Base (RPM-OSTree) - Removals
  - type: rpm-ostree
    remove:
      # Browsers & Runtimes
      - firefox
      - firefox-langpacks

      # Text Editor (Kate → Flatpak, KWrite stays)
      - kate
      - kate-plugins
      - kate-krunner-plugin

      # System Utilities & Bloat
      - firewall-config
      - htop
      - kdebugsettings
      - nvtop
      - plasma-drkonqi

      # Core & Configuration
      - fcitx5
      - fcitx5-configtool
      - fcitx5-data
      - fcitx5-libs
      - fcitx5-lua
      - fcitx5-m17n
      - kcm-fcitx5

      # UI Modules
      - fcitx5-gtk
      - fcitx5-gtk3
      - fcitx5-gtk4
      - fcitx5-qt
      - fcitx5-qt-libfcitx5qt6widgets
      - fcitx5-qt-libfcitx5qtdbus
      - fcitx5-qt-qt6gui
      - fcitx5-qt5
      - fcitx5-qt6

      # Fcitx5 Language Engines
      - fcitx5-chewing
      - fcitx5-chinese-addons
      - fcitx5-chinese-addons-data
      - fcitx5-hangul
      - fcitx5-libthai
      - fcitx5-mozc
      - fcitx5-sayura
      - fcitx5-unikey

      # Exclusive Fcitx5 Dependencies
      - libime
      - libime-data
      - xcb-imdkit

  # 3. Files (Static Configuration)
  - type: files
    files:
      - source: rpms
        destination: /tmp/rpms
      - source: rootfs
        destination: /
      - source: scripts-extra
        destination: /tmp/scripts-extra

  # 4. Homebrew
  - type: brew

  # 5. Fonts
  - type: fonts
    fonts:
      nerd-fonts:
        - NerdFontsSymbolsOnly
      google-fonts:
        - Caladea
        - Carlito
        - Fira Mono
        - Fira Sans
        - Google Sans Flex
        - JetBrains Mono

  # 6. Flatpaks (Flathub)
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: false
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
          name: flathub
          title: Flathub
        install:
          - org.kde.elisa
          - org.kde.haruna
          - org.kde.kalk
          - org.kde.koko
          - org.kde.marknote
          - org.kde.merkuro
          - org.kde.okular
          - org.kde.skanpage
      - scope: user
        notify: false
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
          name: flathub
        remove-repo: true

  # 7. Service Configuration (Systemd)
  - type: systemd
    system:
      enabled:
        - nvidia-powerd.service
        - rpm-ostreed-automatic.timer
        - supergfxd.service
        - switcheroo-control.service

  # 8. Configuration Scripts (Execution Order)
  - type: script
    scripts:
      - swap-display-manager.sh # 1. Display Manager (SDDM → Plasma Login)
      - install-chrome.sh # 2. Browser (Chrome RPM)
      - install-antigravity.sh # 3. Antigravity Auto-Updater
      - install-oh-my-bash.sh # 4. Terminal Setup (Oh My Bash)
      - configure-nvidia.sh # 5. GPU Power Management
      - setup-root-theme-sync.sh # 6. Root Theme Sync
      - install-epson-escpr.sh # 7. Printer Drivers

  # 9. Post-Install Permissions & DNF Wrapper
  - type: containerfile
    snippets:
      - "RUN mkdir -p /usr/local/bin && cp /tmp/scripts-extra/dnf-wrapper /usr/local/bin/dnf && chmod +x /usr/local/bin/dnf"
      - "RUN chmod +x /etc/grub.d/40_windows"

  # 10. Image Signing (Cosign)
  - type: signing
