---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: fedora-kinoite-nitro-an515-43
description: Fedora Kinoite (Fedora 43 / Nvidia) optimized for Acer Nitro 5 (AN515-43).
base-image: ghcr.io/ublue-os/kinoite-nvidia
image-version: 43

modules:
  # 1. System Base (RPM-OSTree) - Installations
  - type: rpm-ostree
    install:
      # Bootloader / GRUB Tools
      - os-prober

      # Office Suite (Apps)
      - libreoffice-calc
      - libreoffice-draw
      - libreoffice-impress
      - libreoffice-math
      - libreoffice-writer

      # Office Suite (Complements)
      - autocorr-pt
      - libreoffice-filters
      - libreoffice-kf6
      - libreoffice-langpack-pt-BR
      - libreoffice-opensymbol-fonts
      - libreoffice-pdfimport

      # Power Management
      - switcheroo-control

      # System Integration & Tools
      - plasma-firewall

  # 2. System Base (RPM-OSTree) - Removals
  - type: rpm-ostree
    remove:
      # --- GUI Applications & Interfaces ---
      - firefox
      - firefox-langpacks
      - kate
      - kate-krunner-plugin
      - kate-plugins
      - firewall-config
      - kdebugsettings
      - plasma-drkonqi
      - plasma-welcome
      - supergfxctl-plasmoid

      # --- CLI Tools ---
      - toolbox

      # --- Intel Media & Video Acceleration ---
      - intel-gmmlib
      - intel-mediasdk
      - intel-vaapi-driver
      - intel-vpl-gpu-rt
      - libva-intel-media-driver

      # --- Intel Hardware Firmware ---
      - intel-audio-firmware
      - intel-gpu-firmware
      - intel-vsc-firmware

      # --- Intel Network Firmware (Wi-Fi/BT) ---
      - iwlegacy-firmware
      - iwlwifi-dvm-firmware
      - iwlwifi-mld-firmware
      - iwlwifi-mvm-firmware

      # --- Unused Fonts (Asian / Legacy) ---
      - google-noto-sans-balinese-fonts
      - google-noto-sans-cjk-fonts
      - google-noto-sans-javanese-fonts
      - google-noto-sans-sundanese-fonts

      # --- Language Engines & Input Methods (Fcitx5/IBus Bloat) ---
      - fcitx5
      - fcitx5-chewing
      - fcitx5-chinese-addons
      - fcitx5-chinese-addons-data
      - fcitx5-configtool
      - fcitx5-data
      - fcitx5-gtk
      - fcitx5-gtk3
      - fcitx5-gtk4
      - fcitx5-hangul
      - fcitx5-libs
      - fcitx5-libthai
      - fcitx5-lua
      - fcitx5-m17n
      - fcitx5-mozc
      - fcitx5-sayura
      - fcitx5-unikey
      - kcm-fcitx5
      # IBus Ecosystem
      - ibus-anthy
      - ibus-anthy-python
      - ibus-chewing
      - ibus-hangul
      - ibus-libpinyin
      - ibus-m17n
      # Input Base Libraries (IME/Mozc/Pinyin)
      - anthy-unicode
      - kasumi-unicode
      - libchewing
      - libhangul
      - libime
      - libime-data
      - libpinyin
      - libpinyin-data
      - opencc
      - xcb-imdkit

  # 3. Files (Static Configuration)
  - type: files
    files:
      - source: rpms
        destination: /tmp/rpms
      - source: rootfs
        destination: /

  # 4. Homebrew
  - type: brew

  # 5. Fonts
  - type: fonts
    fonts:
      nerd-fonts:
        - NerdFontsSymbolsOnly

      google-fonts:
        # Google
        - Google Sans
        - Google Sans Code
        - Google Sans Flex
        - Google Sans Text

        # Microsoft Replacements
        - Arimo # (Replaces Arial)
        - Caladea # (Replaces Cambria)
        - Carlito # (Replaces Calibri)
        - Comic Neue # (Replaces Comic Sans MS)
        - Cousine # (Replaces Courier New)
        - Tinos # (Replaces Times New Roman)

  # 6. Flatpaks (Flathub)
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: false
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
          name: flathub
          title: Flathub
        install:
          # --- Containers & Virtualization ---
          - io.github.DenysMb.Kontainer

          # --- KDE Media & Utilities ---
          - org.kde.elisa
          - org.kde.haruna
          - org.kde.kalk
          - org.kde.koko
          - org.kde.marknote

          # --- KDE Office & Productivity ---
          - org.kde.merkuro
          - org.kde.okular
          - org.kde.skanpage

  # 7. Service Configuration (Systemd)
  - type: systemd
    system:
      enabled:
        - nvidia-powerd.service
        - supergfxd.service
        - switcheroo-control.service

  # 8. Configuration Scripts (Execution Order)
  - type: script
    scripts:
      - swap-display-manager.sh # 1. Display Manager (SDDM → Plasma Login)
      - install-chrome.sh # 2. Browser (Chrome RPM)
      - install-antigravity.sh # 3. Antigravity Auto-Updater
      - install-oh-my-bash.sh # 4. Terminal Setup (Oh My Bash)
      - install-epson-escpr.sh # 5. Printer Drivers
      - system-cleanup.sh # 6. System Cleanup (Icons & Mozilla residues)

  # 9. Image Signing (Cosign)
  - type: signing
