---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: fedora-kinoite-nitro-an515-43
description: Fedora Kinoite (Fedora 43 / Nvidia) optimized for Acer Nitro 5 (AN515-43).
base-image: ghcr.io/ublue-os/kinoite-nvidia
image-version: 43

modules:
  # 1. Enable KDE Beta Repository
  - type: dnf
    repos:
      copr:
        - "@kdesig/kde-beta"
    install:
      packages:
        - "https://repo.linrunner.de/fedora/tlp/repos/releases/tlp-release.fc43.noarch.rpm"

  # 2. Purge Legacy Components
  - type: dnf
    remove:
      packages:
        # Power Management (Conflicts with TLP)
        - tuned
        - tuned-ppd

        # Browsers & Runtimes
        - firefox
        - firefox-langpacks
        # - mozilla-filesystem # Preserving to avoid dependency chain removal

        # System Utilities & Bloat
        - toolbox
        - firewall-config
        - kdebugsettings
        - plasma-drkonqi
        - htop
        - nvtop

        # Input Methods (Fcitx5) - Commented to preserve desktop environment
        # - fcitx5
        # - fcitx5-autostart
        # - fcitx5-chewing
        # - fcitx5-chinese-addons
        # - fcitx5-chinese-addons-data
        # - fcitx5-configtool
        # - fcitx5-data
        # - fcitx5-gtk
        # - fcitx5-gtk3
        # - fcitx5-gtk4
        # - fcitx5-hangul
        # - fcitx5-libs
        # - fcitx5-libthai
        # - fcitx5-lua
        # - fcitx5-m17n
        # - fcitx5-mozc
        # - fcitx5-qt
        # - fcitx5-qt-libfcitx5qt6widgets
        # - fcitx5-qt-libfcitx5qtdbus
        # - fcitx5-qt-qt6gui
        # - fcitx5-qt5
        # - fcitx5-qt6
        # - fcitx5-sayura
        # - fcitx5-unikey
        # - kcm-fcitx5
        # - libchewing
        # - libime
        # - libime-data

        # Input Methods (Ibus) - Commented to preserve desktop environment
        # - ibus-anthy
        # - ibus-anthy-python
        # - ibus-chewing
        # - ibus-hangul
        # - ibus-libpinyin
        # - ibus-m17n
        # - kasumi-common
        # - kasumi-unicode

  # 3. Install Core Applications & Utilities
  - type: dnf
    install:
      packages:
        # Office Suite (Productivity)
        - libreoffice-calc
        - libreoffice-draw
        - libreoffice-filters
        - libreoffice-impress
        - libreoffice-kf6
        - libreoffice-langpack-pt-BR
        - libreoffice-math
        - libreoffice-writer

        # Power Management
        - tlp
        - tlp-pd
        - tlp-rdw
        - switcheroo-control

        # System Integration & Tools
        - distrobox
        - plasma-discover-rpm-ostree
        - plasma-firewall

  # 4. Local RPM Preparation
  - type: files
    files:
      - source: rpms
        destination: /tmp/rpms

  # 5. Service Configuration
  - type: systemd
    system:
      enabled:
        - nvidia-powerd.service
        - rpm-ostreed-automatic.timer
        - tlp.service
        - tlp-pd.service
        - switcheroo-control.service
      masked:
        - systemd-rfkill.service
        - systemd-rfkill.socket

  # 6. Hardware & User Customization Scripts
  - type: script
    scripts:
      - upgrade-kde-beta.sh
      - install-oh-my-bash.sh
      - setup-tlp.sh
      - configure-nvidia.sh
      - install-chrome.sh
      - setup-root-theme-sync.sh
      - configure-grub.sh
      - install-epson-escpr.sh

  - type: brew

  - type: fonts
    fonts:
      nerd-fonts:
        - NerdFontsSymbolsOnly
      google-fonts:
        - Fira Sans
        - Fira Mono

  - type: default-flatpaks
    configurations:
      - scope: system
        notify: true
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
          name: flathub
          title: Flathub
        install:
          - org.kde.okular
          - org.kde.elisa
          - org.kde.haruna
          - org.kde.skanpage
          - org.kde.kalk
          - org.kde.koko
          - org.kde.marknote
          - org.kde.merkuro
          - io.github.DenysMb.Kontainer
      - scope: user
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
          name: flathub
        remove-repo: true

  - type: signing
