---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: fedora-kinoite-nitro-an515-43
description: Fedora Kinoite (Fedora 43 / Nvidia) optimized for Acer Nitro 5 (AN515-43).
base-image: ghcr.io/ublue-os/kinoite-nvidia
image-version: 43

modules:
  # 1. Enable KDE Beta Repository
  - type: dnf
    repos:
      copr:
        - "@kdesig/kde-beta"

  # 2. Perform Full System Update (KDE Beta + Official Repos)
  - type: script
    scripts:
      - upgrade-kde-beta.sh

  # 3. Install New Login Manager (After system is updated)
  - type: dnf
    install:
      packages:
        - plasma-login-manager
        - kcm-plasmalogin

  # 4. Enable Login Manager Service
  - type: systemd
    system:
      enabled:
        - plasmalogin.service

  # 5. Purge Legacy Components (AFTER new manager is ready)
  - type: dnf
    remove:
      packages:
        - sddm
        - tuned
        - tuned-ppd
        - firefox
        - firefox-langpacks
        - mozilla-filesystem
        - toolbox
        - firewall-config
        - kdebugsettings
        - plasma-drkonqi
        - fcitx5
        - fcitx5-autostart
        - fcitx5-chewing
        - fcitx5-chinese-addons
        - fcitx5-chinese-addons-data
        - fcitx5-configtool
        - fcitx5-data
        - fcitx5-gtk
        - fcitx5-gtk3
        - fcitx5-gtk4
        - fcitx5-hangul
        - fcitx5-libs
        - fcitx5-libthai
        - fcitx5-lua
        - fcitx5-m17n
        - fcitx5-mozc
        - fcitx5-qt
        - fcitx5-qt-libfcitx5qt6widgets
        - fcitx5-qt-libfcitx5qtdbus
        - fcitx5-qt-qt6gui
        - fcitx5-qt5
        - fcitx5-qt6
        - fcitx5-sayura
        - fcitx5-unikey
        - kcm-fcitx5
        - libchewing
        - libime
        - libime-data
        - ibus-anthy
        - ibus-anthy-python
        - ibus-chewing
        - ibus-hangul
        - ibus-libpinyin
        - ibus-m17n
        - kasumi-common
        - kasumi-unicode
        - htop
        - nvtop
        - kate
        - kate-krunner-plugin
        - kate-plugins

  # 6. Install Core Applications & Utilities
  - type: dnf
    install:
      packages:
        - libreoffice-calc
        - libreoffice-draw
        - libreoffice-graphicfilter
        - libreoffice-impress
        - libreoffice-kf6
        - libreoffice-langpack-pt-BR
        - libreoffice-math
        - libreoffice-writer
        - tlp
        - tlp-pd
        - tlp-rdw
        - switcheroo-control
        - distrobox
        - plasma-discover-rpm-ostree
        - plasma-firewall

  # 7. Local RPM Preparation
  - type: files
    files:
      - source: files/rpms
        destination: /tmp/rpms

  # 8. Service Configuration
  - type: systemd
    system:
      enabled:
        - nvidia-powerd.service
        - rpm-ostreed-automatic.timer
        - tlp.service
        - tlp-pd.service
        - switcheroo-control.service
      masked:
        - systemd-rfkill.service
        - systemd-rfkill.socket

  # 9. Hardware & User Customization Scripts
  - type: script
    scripts:
      - install-oh-my-bash.sh
      - setup-tlp.sh
      - configure-nvidia.sh
      - install-chrome.sh
      - setup-root-theme-sync.sh
      - configure-grub.sh
      - install-epson-escpr.sh

  - type: brew

  - type: fonts
    fonts:
      nerd-fonts:
        - NerdFontsSymbolsOnly
      google-fonts:
        - Fira Sans
        - Fira Mono

  - type: default-flatpaks
    configurations:
      - scope: system
        notify: true
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
          name: flathub
          title: Flathub
        install:
          - org.kde.okular
          - org.kde.elisa
          - org.kde.haruna
          - org.kde.skanpage
          - org.kde.kalk
          - org.kde.koko
          - org.kde.marknote
          - org.kde.kwrite
          - org.kde.merkuro
          - io.github.DenysMb.Kontainer
      - scope: user
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
          name: flathub
        remove-repo: true

  - type: signing
