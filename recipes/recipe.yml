---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: fedora-kinoite-nitro-an515-43
description: Fedora Kinoite (Fedora 43 / Nvidia) optimized for Acer Nitro 5 (AN515-43).
base-image: ghcr.io/ublue-os/kinoite-nvidia
image-version: 43

modules:
  # 1. System Base (RPM-OSTree) - Installations
  - type: rpm-ostree
    install:
      # Bootloader / GRUB Tools
      - os-prober

      # Multimedia
      - ffmpegthumbnailer

      # Office Suite
      - autocorr-pt
      - libreoffice-calc
      - libreoffice-draw
      - libreoffice-filters
      - libreoffice-impress
      - libreoffice-kf6
      - libreoffice-langpack-pt-BR
      - libreoffice-math
      - libreoffice-opensymbol-fonts
      - libreoffice-pdfimport
      - libreoffice-writer

      # Power Management
      - switcheroo-control

      # System Integration & Tools
      - plasma-firewall

  # 2. System Base (RPM-OSTree) - Removals
  - type: rpm-ostree
    remove:

      # --- Mozilla Firefox ---
      - firefox
      - firefox-langpacks

      # --- KDE Kate Editor ---
      - kate
      - kate-krunner-plugin
      - kate-plugins

      # --- Fedora Utilities ---
      - firewall-config
      - toolbox

      # --- KDE Plasma Core / Extensions ---
      - kdebugsettings
      - plasma-drkonqi
      - plasma-welcome

      # --- Asus ROG (Supergfxctl) ---
      - supergfxctl-plasmoid

      # --- Unused Fonts (Asian / Legacy) ---
      - google-noto-sans-balinese-fonts
      - google-noto-sans-cjk-fonts
      - google-noto-sans-javanese-fonts
      - google-noto-sans-sundanese-fonts

      # Language Engines
      # --- Fcitx5 Ecosystem ---
      - fcitx5
      - fcitx5-chewing
      - fcitx5-chinese-addons
      - fcitx5-chinese-addons-data
      - fcitx5-configtool
      - fcitx5-data
      - fcitx5-gtk
      - fcitx5-gtk2
      - fcitx5-gtk3
      - fcitx5-gtk4
      - fcitx5-hangul
      - fcitx5-libs
      - fcitx5-libthai
      - fcitx5-lua
      - fcitx5-m17n
      - fcitx5-mozc
      - fcitx5-qt
      - fcitx5-qt5
      - fcitx5-qt6
      - fcitx5-qt-libfcitx5qt6widgets
      - fcitx5-qt-libfcitx5qtdbus
      - fcitx5-qt-qt6gui
      - fcitx5-sayura
      - fcitx5-unikey
      - kcm-fcitx5

      # --- IBus Ecosystem ---
      - ibus-anthy
      - ibus-chewing
      - ibus-hangul
      - ibus-libpinyin
      - ibus-m17n

      # --- Input Base Libraries (IME/Mozc/Pinyin) ---
      - anthy-unicode
      - libchewing
      - libhangul
      - libime
      - libime-data
      - libpinyin
      - libpinyin-data
      - mozc-data
      - opencc
      - xcb-imdkit

  # 3. Files (Static Configuration)
  - type: files
    files:
      - source: rpms
        destination: /tmp/rpms
      - source: rootfs
        destination: /

  # 4. Homebrew
  - type: brew

  # 5. Fonts
  - type: fonts
    fonts:
      nerd-fonts:
        - NerdFontsSymbolsOnly

      google-fonts:
        # Google
        - Google Sans
        - Google Sans Code
        - Google Sans Flex
        - Google Sans Text

        # Microsoft Replacements
        - Arimo         # (Replaces Arial)
        - Caladea       # (Replaces Cambria)
        - Carlito       # (Replaces Calibri)
        - Comic Neue    # (Replaces Comic Sans MS)
        - Cousine       # (Replaces Courier New)
        - Tinos         # (Replaces Times New Roman)

        # Mozilla
        - Fira Mono
        - Fira Sans

        # JetBrains
        - JetBrains Mono

        # Microsoft
        - Cascadia Code

  # 6. Flatpaks (Flathub)
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: false
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
          name: flathub
          title: Flathub
        install:
          # --- Containers & Virtualization ---
          - io.github.DenysMb.Kontainer

          # --- KDE Media & Utilities ---
          - org.kde.elisa
          - org.kde.haruna
          - org.kde.kalk
          - org.kde.koko
          - org.kde.marknote

          # --- KDE Office & Productivity ---
          - org.kde.merkuro
          - org.kde.okular
          - org.kde.skanpage

  # 7. Service Configuration (Systemd)
  - type: systemd
    system:
      enabled:
        - nvidia-powerd.service
        - supergfxd.service
        - switcheroo-control.service

  # 8. Configuration Scripts (Execution Order)
  - type: script
    scripts:
      - swap-display-manager.sh # 1. Display Manager (SDDM → Plasma Login)
      - install-chrome.sh # 2. Browser (Chrome RPM)
      - install-antigravity.sh # 3. Antigravity Auto-Updater
      - install-oh-my-bash.sh # 4. Terminal Setup (Oh My Bash)
      - install-epson-escpr.sh # 5. Printer Drivers
      - hide-app-icons.sh # 6. Hide unwanted GUI icons (htop, nvtop)

  # 9. Image Signing (Cosign)
  - type: signing
