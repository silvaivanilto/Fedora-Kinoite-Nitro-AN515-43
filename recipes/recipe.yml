---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: fedora-kinoite-nitro-an515-43
description: Fedora Kinoite (Fedora 43 / Nvidia) optimized for Acer Nitro 5 (AN515-43).
base-image: ghcr.io/ublue-os/kinoite-nvidia
image-version: 43

modules:
  # 1. System Base (RPM-OSTree) - Installations
  - type: rpm-ostree
    install:
      # Bootloader
      - rEFInd

      # Multimedia
      - ffmpegthumbnailer

      # Office Suite
      - autocorr-pt
      - libreoffice-calc
      - libreoffice-draw
      - libreoffice-filters
      - libreoffice-impress
      - libreoffice-kf6
      - libreoffice-langpack-pt-BR
      - libreoffice-math
      - libreoffice-opensymbol-fonts
      - libreoffice-pdfimport
      - libreoffice-writer

      # Power Management
      - switcheroo-control

      # System Integration & Tools
      - plasma-discover-rpm-ostree
      - plasma-firewall

  # 2. System Base (RPM-OSTree) - Removals
  - type: rpm-ostree
    remove:
      # Apple & iOS Devices
      - libimobiledevice-utils
      - usbmuxd

      # CLI & Network Utilities
      - catdoc
      - htop
      - lrzsz
      - mpage
      - mtr
      - tcpdump
      - tmux
      - traceroute
      - vim-enhanced

      # Default Applications
      - firefox
      - firefox-langpacks
      - kate
      - kate-krunner-plugin
      - kate-plugins

      # Fonts (Asian & Unused)
      - google-noto-sans-balinese-fonts
      - google-noto-sans-cjk-fonts
      - google-noto-sans-javanese-fonts
      - google-noto-sans-sundanese-fonts

      # Gaming & Peripherals
      - libratbag-ratbagd
      - openrgb-udev-rules
      - oversteer-udev
      - solaar-udev

      # Hardware Drivers (Intel)
      - intel-audio-firmware
      - intel-gpu-firmware
      - intel-mediasdk
      - intel-vaapi-driver
      - intel-vpl-gpu-rt
      - intel-vsc-firmware
      - libva-intel-media-driver

      # Input Method (Fcitx5 / Asian Languages)
      # Dependências Exclusivas
      - libime
      - libime-data
      - xcb-imdkit
      # Motores de Idioma
      - fcitx5-chewing
      - fcitx5-chinese-addons
      - fcitx5-chinese-addons-data
      - fcitx5-hangul
      - fcitx5-libthai
      - fcitx5-mozc
      - fcitx5-sayura
      - fcitx5-unikey
      # Módulos de Interface
      - fcitx5-gtk
      - fcitx5-gtk3
      - fcitx5-gtk4
      - fcitx5-qt
      - fcitx5-qt5
      - fcitx5-qt6
      - fcitx5-qt-libfcitx5qt6widgets
      - fcitx5-qt-libfcitx5qtdbus
      - fcitx5-qt-qt6gui
      # Núcleo e Configuração
      - fcitx5
      - fcitx5-configtool
      - fcitx5-data
      - fcitx5-libs
      - fcitx5-lua
      - fcitx5-m17n
      - kcm-fcitx5

      # System Diagnostics & Monitors
      - libva-utils
      - nvme-cli
      - nvtop
      - powerstat

      # System Utilities & Integration
      - firewall-config
      - icoutils
      - kdebugsettings
      - plasma-drkonqi
      - supergfxctl-plasmoid
      - toolbox

      # Virtualization & Guest Agents
      - hyperv-daemons
      - hyperv-daemons-license
      - hypervfcopyd
      - hypervkvpd
      - hypervvssd
      - open-vm-tools
      - open-vm-tools-desktop
      - qemu-guest-agent
      - spice-vdagent
      - spice-webdavd
      - virtualbox-guest-additions

      # YubiKey & Authentication
      - pam-u2f
      - pam_yubico
      - pamu2fcfg
      - python3-yubikey-manager
      - yubikey-manager

  # 3. Files (Static Configuration)
  - type: files
    files:
      - source: rpms
        destination: /tmp/rpms
      - source: rootfs
        destination: /

  # 4. Homebrew
  - type: brew

  # 5. Fonts
  - type: fonts
    fonts:
      nerd-fonts:
        - NerdFontsSymbolsOnly
      google-fonts:
        - Arimo
        - Caladea
        - Carlito
        - Cascadia Code
        - Comic Neue
        - Cousine
        - Fira Mono
        - Fira Sans
        - Google Sans Flex
        - JetBrains Mono
        - Roboto
        - Roboto Mono
        - Tinos

  # 6. Flatpaks (Flathub)
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: false
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
          name: flathub
          title: Flathub
        install:
          - io.github.DenysMb.Kontainer
          - org.kde.elisa
          - org.kde.haruna
          - org.kde.kalk
          - org.kde.koko
          - org.kde.marknote
          - org.kde.merkuro
          - org.kde.okular
          - org.kde.skanpage
      - scope: user
        notify: false
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
          name: flathub
        remove-repo: true

  # 7. Service Configuration (Systemd)
  - type: systemd
    system:
      enabled:
        - nvidia-powerd.service
        - rpm-ostreed-automatic.timer
        - supergfxd.service
        - switcheroo-control.service

  # 8. Configuration Scripts (Execution Order)
  - type: script
    scripts:
      - swap-display-manager.sh # 1. Display Manager (SDDM → Plasma Login)
      - install-chrome.sh # 2. Browser (Chrome RPM)
      - install-antigravity.sh # 3. Antigravity Auto-Updater
      - install-oh-my-bash.sh # 4. Terminal Setup (Oh My Bash)
      - install-epson-escpr.sh # 5. Printer Drivers

  # 9. Image Signing (Cosign)
  - type: signing
