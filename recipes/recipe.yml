---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: fedora-kinoite-nitro-an515-43
description: Fedora Kinoite (Fedora 44 / Nvidia) optimized for Acer Nitro 5 (AN515-43).
base-image: ghcr.io/ublue-os/kinoite-nvidia
image-version: 44

modules:
  # 1. System Base (RPM-OSTree) - Installations
  - type: rpm-ostree
    install:
      # Bootloader / GRUB Tools
      - os-prober

      # Office Suite (Apps)
      - libreoffice-calc
      - libreoffice-draw
      - libreoffice-impress
      - libreoffice-math
      - libreoffice-writer

      # Office Suite (Complements)
      - autocorr-pt
      - libreoffice-filters
      - libreoffice-kf6
      - libreoffice-langpack-pt-BR
      - libreoffice-opensymbol-fonts
      - libreoffice-pdfimport

      # Power Management
      - switcheroo-control

      # System Integration & Tools
      - plasma-firewall

  # 2. System Base (RPM-OSTree) - Removals
  - type: rpm-ostree
    remove:
      # --- GUI Applications & Interfaces ---
      - firefox
      - firefox-langpacks
      - kate
      - kate-krunner-plugin
      - kate-plugins
      - firewall-config
      - kdebugsettings
      - plasma-drkonqi
      - plasma-welcome

      # --- CLI Tools ---
      - toolbox
      - vim-common
      - vim-data
      - vim-enhanced
      - vim-filesystem
      - vim-minimal

      # --- Unused Hardware Drivers & Firmware (Non-AMD/Nvidia) ---
      # Intel Hardware (GPU/Video/Audio/Network)
      - intel-gmmlib
      - intel-mediasdk
      - intel-vaapi-driver
      - intel-vpl-gpu-rt
      - libva-intel-media-driver
      - intel-audio-firmware
      - intel-gpu-firmware
      - intel-vsc-firmware
      - iwlegacy-firmware
      - iwlwifi-dvm-firmware
      - iwlwifi-mld-firmware
      - iwlwifi-mvm-firmware
      # Other Hardware (Broadcom, MediaTek, Marvell, etc.)
      - brcmfmac-firmware
      - mt7xxx-firmware
      - nxpwireless-firmware
      - tiwilink-firmware
      - libertas-firmware
      - cirrus-audio-firmware
      - qcom-wwan-firmware

      # --- Language Engines & Input Methods (Fcitx5/IBus Bloat) ---
      - fcitx5
      - fcitx5-chewing
      - fcitx5-chinese-addons
      - fcitx5-chinese-addons-data
      - fcitx5-configtool
      - fcitx5-data
      - fcitx5-gtk
      - fcitx5-gtk3
      - fcitx5-gtk4
      - fcitx5-hangul
      - fcitx5-libs
      - fcitx5-libthai
      - fcitx5-lua
      - fcitx5-m17n
      - fcitx5-mozc
      - fcitx5-qt
      - fcitx5-qt6
      - fcitx5-qt-libfcitx5qt6widgets
      - fcitx5-qt-qt6gui
      - fcitx5-sayura
      - fcitx5-unikey
      - kcm-fcitx5
      - libime
      - libime-data
      - xcb-imdkit
      - kasumi-common
      - kasumi-unicode
      - ibus-anthy
      - ibus-anthy-python

      # --- Redundant Apps & Drivers ---
      # Printer Drivers (Keeping Epson, removing others)
      - hplip
      - hplip-common
      - hplip-libs
      - libsane-hpaio
      - printer-driver-brlaser
      - ptouch-driver
      - splix
      - gutenprint
      - gutenprint-cups
      - gutenprint-libs
      - dymo-cups-drivers
      # Multimedia Redundancy (Keeping GStreamer, removing VLC system backend)
      - phonon-backend-vlc-common
      - phonon-qt5-backend-vlc
      - phonon-qt6-backend-vlc
      - vlc-libs
      - vlc-plugins-base
      - vlc-plugins-video-out
      - vlc-plugin-ffmpeg
      - vlc-plugin-gstreamer
      - vlc-plugin-pipewire
      - vlc-plugin-pulseaudio

      # --- Virtualization Guest Agents (Bare Metal optimization) ---
      - open-vm-tools
      - open-vm-tools-desktop
      - qemu-guest-agent
      - virtualbox-guest-additions
      - hyperv-daemons
      - hyperv-daemons-license
      - hypervfcopyd
      - hypervkvpd
      - hypervvssd

      # --- Accessibility & Unused Hardware Features ---
      - orca
      - brltty
      - speech-dispatcher
      - speech-dispatcher-espeak-ng
      - speech-dispatcher-libs
      - speech-dispatcher-utils
      - espeak-ng
      - bolt
      - plasma-thunderbolt
      - fprintd
      - fprintd-pam
      - libfprint
      - jfsutils
      - qt6-qtspeech-speechd
      - qt5-qtspeech-speechd

      # --- Heavy KDE Services (Akonadi/MariaDB Debloat) ---
      - akonadi-server
      - akonadi-server-mysql
      - mariadb
      - mariadb-server
      - mariadb-backup
      - mariadb-errmsg
      - mariadb-common
      - mariadb-gssapi-server
      - mariadb-cracklib-password-check

      # --- Mobile Network Services (LTE/5G Redundancy) ---
      # Kept: ModemManager, ModemManager-glib, NetworkManager-wwan, geoclue2
      # (dependency chain: xdg-desktop-portal → geoclue2 → ModemManager-glib → ModemManager)

      # --- Legacy Network Protocols & Security ---
      - nfs-utils
      - nfsv3-client-utils
      - nfs-client-utils
      - rpcbind
      - pcsc-lite
      - pcsc-lite-libs
      - pcsc-lite-ccid
      - python3-yubikey-manager
      - yubikey-manager
      - opensc-libs
      - opensc
      - python3-pyscard

      # --- VPN Protocols (Unused by User) ---
      - openconnect
      - openvpn
      - vpnc
      - NetworkManager-openconnect
      - NetworkManager-openvpn
      - NetworkManager-vpnc
      - plasma-nm-openconnect
      - plasma-nm-openvpn
      - plasma-nm-vpnc

      # --- Hardware Optimization (AMD / Nitro 5) ---
      - thermald

      # --- Redundant KDE Utilities ---
      - khelpcenter
      - kamera

  # 3. Files (Static Configuration)
  - type: files
    files:
      - source: rpms
        destination: /tmp/rpms
      - source: rootfs
        destination: /

  # 4. Homebrew
  - type: brew

  # 5. Fonts
  - type: fonts
    fonts:
      nerd-fonts:
        - NerdFontsSymbolsOnly

      google-fonts:
        # Google
        - Google Sans
        - Google Sans Code
        - Google Sans Flex
        - Google Sans Text

        # Microsoft Replacements
        - Arimo # (Replaces Arial)
        - Caladea # (Replaces Cambria)
        - Carlito # (Replaces Calibri)
        - Comic Neue # (Replaces Comic Sans MS)
        - Cousine # (Replaces Courier New)
        - Tinos # (Replaces Times New Roman)

  # 6. Flatpaks (Flathub)
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: false
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
          name: flathub
          title: Flathub
        install:
          # --- Containers & Virtualization ---
          - io.github.DenysMb.Kontainer

          # --- KDE Media & Utilities ---
          - org.kde.elisa
          - org.kde.haruna
          - org.kde.kalk
          - org.kde.koko
          - org.kde.marknote

          # --- KDE Office & Productivity ---
          - org.kde.merkuro
          - org.kde.okular
          - org.kde.skanpage

  # 7. Service Configuration (Systemd)
  - type: systemd
    system:
      enabled:
        - nvidia-powerd.service
        - supergfxd.service
        - switcheroo-control.service

  # 8. Configuration Scripts (Execution Order)
  - type: script
    scripts:
      - install-chrome.sh # 1. Browser (Chrome RPM)
      - install-oh-my-bash.sh # 2. Terminal Setup (Oh My Bash)
      - install-epson-escpr.sh # 3. Printer Drivers
      - system-cleanup.sh # 4. System Cleanup (Icons & Mozilla residues)

  # 9. Image Signing (Cosign)
  - type: signing
