---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: fedora-silverblue-nitro-an515-43
description: Fedora Silverblue (Fedora 43 / Nvidia) optimized for Acer Nitro 5 (AN515-43).
base-image: ghcr.io/ublue-os/silverblue-nvidia
image-version: 43

modules:
  # 1. System Base (RPM-OSTree) - Installations
  - type: rpm-ostree
    install:
      # Bootloader
      - rEFInd

      # Multimedia
      - ffmpegthumbnailer

      # Office Suite (moved to flatpak)

      # Power Management
      - switcheroo-control

  # 2. System Base (RPM-OSTree) - Removals
  - type: rpm-ostree
    remove:
      # Apple & iOS Devices
      - libimobiledevice-utils
      - usbmuxd

      # CLI & Network Utilities
      - htop
      - mtr
      - tcpdump
      - tmux
      - traceroute
      - vim-enhanced

      # Default Applications
      - firefox
      - firefox-langpacks
      - gnome-software
      - gnome-tour
      - gnome-classic-session
      - gnome-shell-extension-apps-menu
      - gnome-shell-extension-background-logo
      - gnome-shell-extension-launch-new-instance
      - gnome-shell-extension-places-menu
      - gnome-shell-extension-window-list
      - yelp
      - yelp-xsl

      # Input Method (Asian Languages - IBus)
      - ibus-mozc
      - ibus-unikey

      # Fonts (Asian & Unused)
      - google-noto-sans-balinese-fonts
      - google-noto-sans-cjk-fonts
      - google-noto-sans-javanese-fonts
      - google-noto-sans-sundanese-fonts

      # Gaming & Peripherals
      - libratbag-ratbagd
      - openrgb-udev-rules
      - oversteer-udev
      - solaar-udev

      # Hardware Drivers (Intel)
      - intel-audio-firmware
      - intel-gpu-firmware
      - intel-mediasdk
      - intel-vaapi-driver
      - intel-vpl-gpu-rt
      - intel-vsc-firmware
      - libva-intel-media-driver

      # System Diagnostics & Monitors
      - libva-utils
      - nvme-cli
      - nvtop
      - powerstat

      # System Utilities & Integration
      - firewall-config
      - icoutils
      - toolbox

      # Virtualization & Guest Agents
      - hyperv-daemons
      - hyperv-daemons-license
      - hypervfcopyd
      - hypervkvpd
      - hypervvssd
      - open-vm-tools
      - open-vm-tools-desktop
      - qemu-guest-agent
      - spice-vdagent
      - spice-webdavd
      - virtualbox-guest-additions

      # YubiKey & Authentication
      - pam-u2f
      - pam_yubico
      - pamu2fcfg
      - python3-yubikey-manager
      - yubikey-manager

  # 3. Files (Static Configuration)
  - type: files
    files:
      - source: rpms
        destination: /tmp/rpms
      - source: rootfs
        destination: /

  # 4. Homebrew
  - type: brew

  # 5. Fonts
  - type: fonts
    fonts:
      nerd-fonts:
        - NerdFontsSymbolsOnly
      google-fonts:
        - Arimo
        - Caladea
        - Carlito
        - Cascadia Code
        - Comic Neue
        - Cousine
        - Fira Mono
        - Fira Sans
        - Google Sans Flex
        - JetBrains Mono
        - Roboto
        - Roboto Mono
        - Tinos

  # 6. Flatpaks (Flathub)
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: false
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
          name: flathub
          title: Flathub
        install:
          - com.github.johnfactotum.Foliate
          - com.jeffser.Alpaca
          - com.mattjakeman.ExtensionManager
          - com.ranfdev.DistroShelf
          - com.sidevesh.Luminance
          - com.toolstack.Folio
          - de.haeckerfelix.Fragments
          - info.febvre.Komikku
          - io.github.diegopvlk.Cine
          - io.github.htkhiem.Euphonica
          - io.github.josephmawa.Bella
          - io.github.kolunmi.Bazaar
          - io.github.swordpuffin.rewaita
          - net.trowell.typesetter
          - org.gnome.Calculator
          - org.gnome.Calendar
          - org.gnome.FileRoller
          - org.gnome.Loupe
          - org.gnome.NetworkDisplays
          - org.gnome.Papers
          - org.gnome.SimpleScan
          - org.gnome.Snapshot
          - org.gnome.TextEditor
          - org.libreoffice.LibreOffice
          - page.tesk.Refine

      - scope: user
        notify: false
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
          name: flathub
        remove-repo: true

  # 7. GNOME Extensions
  - type: gnome-extensions
    install:
      - 8502
      - 8697
      - 9164
      - 9260
      - 9342

  # 8. Service Configuration (Systemd)
  - type: systemd
    system:
      enabled:
        - nvidia-powerd.service
        - refind-setup.service
        - rpm-ostreed-automatic.timer
        - supergfxd.service
        - switcheroo-control.service

  # 9. Configuration Scripts (Execution Order)
  - type: script
    scripts:
      - install-chrome.sh # 2. Browser (Chrome RPM)
      - install-antigravity.sh # 3. Antigravity Auto-Updater
      - install-oh-my-bash.sh # 4. Terminal Setup (Oh My Bash)
      - install-epson-escpr.sh # 5. Printer Drivers

  # 10. Image Signing (Cosign)
  - type: signing
